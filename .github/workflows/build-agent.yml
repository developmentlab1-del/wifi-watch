name: Build WiFi Watch Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"


permissions:
  contents: write


jobs:

  # ==========================================================
  # WINDOWS
  # ==========================================================

  windows:

    name: Windows

    runs-on: windows-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install Agent dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install pyinstaller


      - name: Verify Python source
        run: |
          python -m py_compile agent/wifi_watch_agent.py


      - name: Verify dependencies
        run: |
          python -c "import requests, psutil, zeroconf, manuf; print('Dependencies OK')"


      - name: Build Windows Agent
        shell: powershell

        run: |

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name WiFiWatchAgent-Windows `
            --collect-all manuf `
            --collect-all zeroconf `
            agent/wifi_watch_agent.py


      - name: Verify Windows build
        shell: powershell

        run: |

          if (!(Test-Path "dist/WiFiWatchAgent-Windows.exe")) {
            Write-Error "Windows executable was not created."
            exit 1
          }

          Get-Item "dist/WiFiWatchAgent-Windows.exe"


      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4

        with:
          name: WiFiWatchAgent-Windows
          path: dist/WiFiWatchAgent-Windows.exe
          if-no-files-found: error
          retention-days: 14


      - name: Upload Windows EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:
          files: dist/WiFiWatchAgent-Windows.exe
          fail_on_unmatched_files: true
          generate_release_notes: true



  # ==========================================================
  # MACOS
  # ==========================================================

  macos:

    name: macOS

    runs-on: macos-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install Agent dependencies
        run: |
          pip install -r agent/requirements.txt
          pip install pyinstaller


      - name: Verify Python source
        run: |
          python -m py_compile agent/wifi_watch_agent.py


      - name: Verify dependencies
        run: |
          python -c "import requests, psutil, zeroconf, manuf; print('Dependencies OK')"


      - name: Build macOS Agent
        run: |

          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "WiFi Watch Agent" \
            --osx-bundle-identifier "com.developmentlab1.wifiwatch.agent" \
            --collect-all manuf \
            --collect-all zeroconf \
            agent/wifi_watch_agent.py


      # ------------------------------------------------------
      # macOS Local Network + Bonjour permissions
      # ------------------------------------------------------

      - name: Add macOS Local Network permissions
        run: |

          PLIST="dist/WiFi Watch Agent.app/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Delete :NSLocalNetworkUsageDescription" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocalNetworkUsageDescription string WiFi Watch needs access to your local network to discover and monitor devices on networks you own or are authorized to manage." \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Delete :NSBonjourServices" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices array" \
            "$PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:0 string _http._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:1 string _https._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:2 string _workstation._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:3 string _airplay._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:4 string _raop._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:5 string _googlecast._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:6 string _ipp._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:7 string _ipps._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:8 string _printer._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:9 string _hap._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:10 string _smb._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:11 string _ssh._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:12 string _device-info._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:13 string _companion-link._tcp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:14 string _sleep-proxy._udp" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSBonjourServices:15 string _spotify-connect._tcp" \
            "$PLIST"


      - name: Verify macOS Info.plist
        run: |

          PLIST="dist/WiFi Watch Agent.app/Contents/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :NSLocalNetworkUsageDescription" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :NSBonjourServices" \
            "$PLIST"


      # ------------------------------------------------------
      # Ad-hoc signing
      #
      # This keeps the bundle internally valid after changing
      # Info.plist. It is NOT Apple notarization.
      # ------------------------------------------------------

      - name: Ad-hoc sign macOS Agent
        run: |

          /usr/bin/codesign \
            --force \
            --deep \
            --sign - \
            "dist/WiFi Watch Agent.app"


      - name: Verify macOS signature
        run: |

          /usr/bin/codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "dist/WiFi Watch Agent.app"


      # ------------------------------------------------------
      # Use ditto so the .app structure survives ZIP download.
      # ------------------------------------------------------

      - name: Create macOS ZIP
        run: |

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "dist/WiFi Watch Agent.app" \
            "dist/WiFiWatchAgent-macOS.zip"


      - name: Verify macOS package
        run: |

          test -f "dist/WiFiWatchAgent-macOS.zip"

          ls -lh "dist/WiFiWatchAgent-macOS.zip"


      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4

        with:
          name: WiFiWatchAgent-macOS
          path: dist/WiFiWatchAgent-macOS.zip
          if-no-files-found: error
          retention-days: 14


      - name: Upload macOS ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:
          files: dist/WiFiWatchAgent-macOS.zip
          fail_on_unmatched_files: true
          generate_release_notes: true



  # ==========================================================
  # LINUX
  # ==========================================================

  linux:

    name: Linux

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Linux system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            python3-tk \
            iproute2 \
            net-tools \
            libgl1


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install Agent dependencies
        run: |

          pip install -r agent/requirements.txt

          pip install pyinstaller


      - name: Verify Python source
        run: |
          python -m py_compile agent/wifi_watch_agent.py


      - name: Verify dependencies
        run: |
          python -c "import requests, psutil, zeroconf, manuf; print('Dependencies OK')"


      - name: Build Linux Agent
        run: |

          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name WiFiWatchAgent-Linux \
            --collect-all manuf \
            --collect-all zeroconf \
            agent/wifi_watch_agent.py


          chmod +x \
            dist/WiFiWatchAgent-Linux


      - name: Verify Linux build
        run: |

          test -f \
            dist/WiFiWatchAgent-Linux

          test -x \
            dist/WiFiWatchAgent-Linux

          ls -lh \
            dist/WiFiWatchAgent-Linux

          file \
            dist/WiFiWatchAgent-Linux


      - name: Upload Linux workflow artifact
        uses: actions/upload-artifact@v4

        with:
          name: WiFiWatchAgent-Linux
          path: dist/WiFiWatchAgent-Linux
          if-no-files-found: error
          retention-days: 14


      - name: Upload Linux binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:
          files: dist/WiFiWatchAgent-Linux
          fail_on_unmatched_files: true
          generate_release_notes: true

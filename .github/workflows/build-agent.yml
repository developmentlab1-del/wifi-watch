name: Build WiFi Watch Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "agent/**"
      - ".github/workflows/build-agent.yml"

  push:
    tags:
      - "v*"


permissions:
  contents: write


jobs:

  # ==========================================================
  # WINDOWS
  # ==========================================================

  windows:

    name: Windows

    runs-on: windows-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt
          pip install pyinstaller


      - name: Build Windows Agent
        shell: powershell

        run: |

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name WiFiWatchAgent-Windows `
            agent/wifi_watch_agent.py


      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4

        with:
          name: WiFiWatchAgent-Windows
          path: dist/WiFiWatchAgent-Windows.exe
          if-no-files-found: error


      - name: Upload Windows EXE directly to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:
          files: dist/WiFiWatchAgent-Windows.exe



  # ==========================================================
  # MACOS
  # ==========================================================

  macos:

    name: macOS

    runs-on: macos-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt
          pip install pyinstaller


      - name: Build macOS Agent
        run: |

          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name WiFiWatchAgent \
            --osx-bundle-identifier com.developmentlab1.wifiwatch.agent \
            agent/wifi_watch_agent.py


      - name: Add Local Network permission
        run: |

          /usr/bin/plutil \
            -replace NSLocalNetworkUsageDescription \
            -string "WiFi Watch needs access to your local network to discover devices on networks you own or are authorized to manage." \
            dist/WiFiWatchAgent.app/Contents/Info.plist


      - name: Re-sign macOS app
        run: |

          /usr/bin/codesign \
            --force \
            --deep \
            --sign - \
            dist/WiFiWatchAgent.app


      - name: Create macOS ZIP
        run: |

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            dist/WiFiWatchAgent.app \
            dist/WiFiWatchAgent-macOS.zip


      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4

        with:
          name: WiFiWatchAgent-macOS
          path: dist/WiFiWatchAgent-macOS.zip
          if-no-files-found: error


      - name: Upload macOS ZIP directly to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:
          files: dist/WiFiWatchAgent-macOS.zip



  # ==========================================================
  # LINUX
  # ==========================================================

  linux:

    name: Linux

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk iproute2


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt
          pip install pyinstaller


      - name: Build Linux Agent
        run: |

          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name WiFiWatchAgent-Linux \
            agent/wifi_watch_agent.py

          chmod +x dist/WiFiWatchAgent-Linux


      - name: Upload Linux workflow artifact
        uses: actions/upload-artifact@v4

        with:
          name: WiFiWatchAgent-Linux
          path: dist/WiFiWatchAgent-Linux
          if-no-files-found: error


      - name: Upload Linux binary directly to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:
          files: dist/WiFiWatchAgent-Linux
